<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Lines Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Card/Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pillShift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .flowing-trace {
      stroke-dasharray: 80 120;
      animation: flowLine 10s linear infinite;
    }
    .p1 { animation: floatParticle 6s ease-in-out infinite; }
    .p2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .p3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .pill-card { animation: pillShift 4s ease-in-out infinite; }
    .pill-card-alt { animation: pillShift 5s ease-in-out infinite 1s; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="0.8">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
    <line x1="1080" y1="0" x2="1080" y2="340"/>
  </g>

  <!-- Ambient Dynamic Orbs (Background depth) -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" class="pulsing-orb" opacity="0.2" filter="url(#glow)"/>
  <circle cx="1020" cy="220" r="160" fill="#a855f7" class="pulsing-orb" opacity="0.22" filter="url(#glow)"/>

  <!-- Flowing Geometric & Reasoning Network Lines -->
  <g fill="none" stroke-width="2">
    <path d="M 50 260 Q 300 80 600 240 T 1150 120" stroke="url(#line-grad)" class="flowing-trace"/>
    <path d="M 80 80 Q 400 300 800 100 T 1120 280" stroke="url(#line-grad)" opacity="0.5" class="flowing-trace" style="animation-duration: 14s;"/>
  </g>

  <!-- Floating Mathematical Symbols (Background layer) -->
  <g fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="300" opacity="0.3">
    <text x="110" y="80" font-size="28" class="p1">∑</text>
    <text x="240" y="280" font-size="26" class="p2">∫ f(x)dx</text>
    <text x="960" y="90" font-size="30" class="p3">∀x ∃y (P(x,y))</text>
    <text x="1060" y="270" font-size="24" class="p1">⊢ φ ∧ ψ</text>
    <text x="500" y="60" font-size="22" class="p2">π ≈ 3.14159</text>
  </g>

  <!-- Animated Mathematical Reasoning Interactive Badges / Dynamic Pills -->
  <g class="pill-card">
    <rect x="75" y="275" width="230" height="38" rx="19" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="95" cy="294" r="6" fill="#38bdf8" filter="url(#soft-glow)"/>
    <text x="112" y="299" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Step-by-Step Chain-of-Thought</text>
  </g>

  <g class="pill-card-alt">
    <rect x="895" y="275" width="230" height="38" rx="19" fill="url(#pill-grad)" stroke="#c084fc" stroke-width="1.2" opacity="0.9"/>
    <circle cx="915" cy="294" r="6" fill="#c084fc" filter="url(#soft-glow)"/>
    <text x="932" y="299" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Formal Theorem Proving (Lean 4)</text>
  </g>

  <!-- FOREGROUND TEXT (Always crisp, prominent, unobstructed) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 72)" text-anchor="middle">
    <rect x="-175" y="-18" width="350" height="30" rx="15" fill="#1e293b" fill-opacity="0.95" stroke="#475569" stroke-width="1"/>
    <text x="0" y="3" fill="#38bdf8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Mathematical Reasoning &amp; Chain-of-Thought
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#primary-grad)">
    AI Solvers, Proof Assistants &amp; Foundation Models
  </text>

  <!-- Subtitle -->
  <text x="600" y="238" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
    Frontier LLM Reasoning • Step-by-Step Solvers • Theorem Proving (Lean 4, Coq) • Open-Source Weights &amp; Datasets
  </text>
</svg>
